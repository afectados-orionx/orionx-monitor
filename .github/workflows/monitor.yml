name: monitor
on:
  schedule:
    - cron: "7 * * * *"      # cada hora
  workflow_dispatch:
permissions:
  contents: write
  issues: write              # alertas: abrir o comentar el issue del movimiento
concurrency: monitor
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 22        # el presupuesto de monitor.py es 15 min; si algo se cuelga, morir y dejar paso a la corrida siguiente
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scripts/publicar.sh rehace el commit sobre origin/main si hace falta
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Guardar la foto anterior de los saldos
        run: cp data.json "$RUNNER_TEMP/data_anterior.json" || true
      - name: Consultar direcciones
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
      - name: Detectar alertas
        run: |
          python scripts/alertas.py \
            --anterior "$RUNNER_TEMP/data_anterior.json" \
            --nuevas "$RUNNER_TEMP/alertas_nuevas.json"
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publicar.sh main   # reintenta si un PR u otra corrida empujó entre medio
      - name: Avisar de los movimientos (issue y, si está configurado, Telegram)
        if: always()            # los datos ya están guardados; un aviso que falle no debe tumbar la corrida
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alertas.py --avisar "$RUNNER_TEMP/alertas_nuevas.json"
